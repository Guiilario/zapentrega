      const pi = document.createElement('span'); pi.className='pp-index'; pi.textContent = `FASE ${idx+1}/${state.phases.length}`;
      const pn = document.createElement('span'); pn.className='pp-name'; pn.textContent = phase.name;
      header.appendChild(pi); header.appendChild(pn);
      section.appendChild(header);

      const boardDiv = document.createElement('div');
      boardDiv.className = 'print-board';

      if(cards.length === 0){
        boardDiv.style.height = '70px';
        const empty = document.createElement('div');
        empty.className = 'print-empty';
        empty.textContent = 'Nenhum item nesta fase.';
        boardDiv.appendChild(empty);
      } else {
        const dims = cards.map(c => ({
          c,
          w: c.w || (c.type==='image'||c.type==='video' ? 290 : 250),
          h: c.h || printFallbackHeight(c)
        }));
        const minX = Math.min(...dims.map(d => d.c.x));
        const minY = Math.min(...dims.map(d => d.c.y));
        const maxX = Math.max(...dims.map(d => d.c.x + d.w));
        const maxY = Math.max(...dims.map(d => d.c.y + d.h));
        const pad = 50;
        boardDiv.style.width = (maxX - minX + pad*2) + 'px';
        boardDiv.style.height = (maxY - minY + pad*2) + 'px';
        for(const d of dims){
          const cardEl = await renderPrintCard(d.c, d.w);
          cardEl.style.left = (d.c.x - minX + pad) + 'px';
          cardEl.style.top = (d.c.y - minY + pad) + 'px';
          if(d.c.h) cardEl.style.height = d.h + 'px';
          boardDiv.appendChild(cardEl);
        }
      }
      section.appendChild(boardDiv);
      container.appendChild(section);
    }

    window.print();
  }

  $('#printBtn').addEventListener('click', printAll);

  // ---------------- SALVAR / BAIXAR ARQUIVO ----------------
  function slugify(s){
    return (s || 'quadro-criativo')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-+|-+$)/g, '') || 'quadro-criativo';
  }

  async function downloadBoard(){
    await Promise.all(state.phases.map(p => loadCards(p.id)));
    const data = {
      app: 'quadro-criativo',
      version: 1,
      exportedAt: new Date().toISOString(),
      title: state.title,
      phases: state.phases,
      activePhase: state.activePhase,
      cards: state.phases.reduce((acc, p) => {
        acc[p.id] = cardsCache[p.id] || [];
        return acc;
      }, {})
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = slugify(state.title) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function importBoardFromFile(file){
    let data;
    try{
      const text = await file.text();
      data = JSON.parse(text);
    }catch(err){
      alert('Não foi possível ler esse arquivo. Verifique se é um arquivo .json exportado por este quadro.');
      return;
    }
    if(!data || !Array.isArray(data.phases)){
      alert('Esse arquivo não parece ser um quadro válido.');
      return;
    }
    if(!confirm('Abrir este arquivo vai substituir o quadro atual pelas configurações salvas nele (a pasta local do projeto continua sendo esta). Deseja continuar?')) return;

    state.title = data.title || 'Quadro Criativo';
    state.details = data.details || state.details || '';
    state.phases = data.phases.map(p => ({ id: p.id || ('p'+uid()), name: p.name || 'Fase' }));
    if(state.phases.length === 0){
      state.phases = DEFAULT_PHASES.map(p => ({...p}));
    }
    state.activePhase = (data.activePhase && state.phases.some(p => p.id === data.activePhase))
      ? data.activePhase
      : state.phases[0].id;

    cardsCache = {};
    selectedCardId = null;
    placeCounter = {};
    for(const p of state.phases){
      const arr = (data.cards && Array.isArray(data.cards[p.id])) ? data.cards[p.id] : [];
      cardsCache[p.id] = arr;
    }
    await writeBoardFile();

    $('#boardTitle').textContent = state.title;
    renderPhaseBar();
    renderCanvas();
  }

  $('#downloadBtn').addEventListener('click', downloadBoard);
  $('#openBtn').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if(file) await importBoardFromFile(file);
    e.target.value = '';
  });

  boot();
})();
</script>
