<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadro Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17191A;
    --bg-2: #1D2021;
    --grid-dot: rgba(255,255,255,0.055);
    --panel: #1F2224;
    --panel-border: rgba(255,255,255,0.09);
    --text-hi: #F3F1EA;
    --text-lo: #9A9C97;
    --text-faint: #6A6D68;

    --card-bg: #F6F4EE;
    --card-bg-2: #FFFFFF;
    --card-ink: #211F1B;
    --card-ink-soft: #726F66;
    --card-border: #E4E0D3;

    --accent: #E8A33D;
    --accent-ink: #1A1200;

    --c-note: #8FA694;
    --c-image: #5E93C2;
    --c-video: #A084C9;
    --c-date: #E8A33D;
    --c-checklist: #4FA085;
    --c-link: #D97B4E;

    --danger: #CC5A45;

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

    --radius: 10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    font-family:var(--font-body);
    color:var(--text-hi);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 26px 6px;
    flex-shrink:0;
  }
  .brand{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand .eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--text-faint);
    text-transform:uppercase;
  }
  #boardTitle{
    font-family:var(--font-display);
    font-weight:600;
    font-size:22px;
    color:var(--text-hi);
    outline:none;
    cursor:text;
    max-width:60vw;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #boardTitle:focus{text-overflow:clip;white-space:normal;}

  .top-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .icon-btn{
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--text-lo);
    width:32px;height:32px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:.15s;
    font-size:14px;
  }
  .icon-btn:hover{border-color:var(--accent);color:var(--accent);}
  .text-btn{
    display:flex;align-items:center;gap:7px;
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--text-lo);
    height:32px;padding:0 12px;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .text-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- PHASE TABS ---------- */
  .phase-bar{
    display:flex;
    align-items:flex-end;
    gap:2px;
    padding:14px 22px 0;
    flex-shrink:0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .phase-bar::-webkit-scrollbar{display:none;}

  .phase-tab{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border-radius:9px 9px 0 0;
    background:var(--bg);
    color:var(--text-lo);
    font-family:var(--font-mono);
    font-size:11.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    white-space:nowrap;
    cursor:pointer;
    border:1px solid transparent;
    border-bottom:none;
    user-select:none;
    transition:.15s;
  }
  .phase-tab:hover{color:var(--text-hi); background:var(--bg-2);}
  .phase-tab.active{
    background:var(--panel);
    color:var(--text-hi);
    border-color:var(--panel-border);
  }
  .phase-tab .dot{
    width:7px;height:7px;border-radius:50%;
    flex-shrink:0;
    box-shadow:0 0 0 3px rgba(255,255,255,0.05);
  }
  .phase-tab .close-tab{
    opacity:0;
    width:14px;height:14px;
    display:flex;align-items:center;justify-content:center;
    border-radius:4px;
    color:var(--text-faint);
    font-size:12px;
    margin-left:2px;
  }
  .phase-tab:hover .close-tab{opacity:1;}
  .phase-tab .close-tab:hover{background:var(--danger);color:#fff;}
  .phase-tab[contenteditable="true"]{outline:1px dashed var(--accent);}
  .phase-tab.dragging{opacity:.4;}

  .add-phase{
    display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;
    margin-bottom:2px;margin-left:6px;
    border-radius:8px;
    border:1px dashed var(--panel-border);
    color:var(--text-faint);
    cursor:pointer;
    font-size:15px;
    flex-shrink:0;
    transition:.15s;
  }
  .add-phase:hover{color:var(--accent);border-color:var(--accent);}

  .phase-progress{
    margin-left:auto;
    padding-bottom:10px;
    padding-left:10px;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-faint);
    letter-spacing:.08em;
    flex-shrink:0;
    white-space:nowrap;
  }

  /* ---------- CANVAS (infinite pan/zoom) ---------- */
  .canvas-wrap{
    flex:1;
    background:var(--panel);
    border-top:1px solid var(--panel-border);
    position:relative;
    overflow:hidden;
    cursor:grab;
    touch-action:none;
    background-image: radial-gradient(circle, var(--grid-dot) 1.2px, transparent 1.2px);
    background-size:26px 26px;
    background-position:0 0;
    user-select:none;
  }
  .canvas-wrap.panning{cursor:grabbing;}

  #canvas{
    position:absolute;
    left:0;top:0;
    width:0;height:0;
    transform-origin:0 0;
    will-change:transform;
  }

  .empty-hint{
    position:absolute;
    top:80px;left:60px;
    width:340px;
    font-family:var(--font-mono);
    font-size:12px;
    line-height:1.7;
    color:var(--text-faint);
    letter-spacing:.02em;
    border-left:2px solid var(--panel-border);
    padding-left:14px;
  }
  .empty-hint b{color:var(--text-lo);}

  /* ---------- ZOOM CONTROLS ---------- */
  .zoom-controls{
    position:fixed;
    left:24px; bottom:24px;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:5px;
    box-shadow:0 8px 22px rgba(0,0,0,0.35);
    gap:2px;
  }
  .zc-btn{
    width:36px;height:32px;
    background:transparent;
    border:none;
    color:var(--text-hi);
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    border-radius:7px;
    transition:.12s;
  }
  .zc-btn:hover{background:var(--bg-2); color:var(--accent);}
  .zc-btn.label{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.03em;
  }
  .zc-sep{width:22px;height:1px;background:var(--panel-border);margin:3px 0;}
  .zc-btn.focus-btn{font-size:15px;}
  .zc-btn:disabled, .zc-btn.disabled{opacity:.3;cursor:default;pointer-events:none;}

  /* ---------- CARDS ---------- */
  .card{
    position:absolute;
    width:250px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-left:3px solid var(--c-note);
    border-radius:var(--radius);
    box-shadow:0 6px 18px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.02);
    color:var(--card-ink);
    display:flex;
    flex-direction:column;
    user-select:none;
    z-index:2;
    min-width:180px;
    min-height:90px;
  }
  .card.dragging{
    box-shadow:0 18px 34px rgba(0,0,0,0.45);
    z-index:50;
    cursor:grabbing;
  }
  .card.selected{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .card[data-type="image"], .card[data-type="video"]{width:290px;}

  .card-head{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px 7px 11px;
    cursor:grab;
    border-bottom:1px solid var(--card-border);
    flex-shrink:0;
  }
  .card-head:active{cursor:grabbing;}
  .type-tag{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:.10em;
    text-transform:uppercase;
    color:var(--card-ink-soft);
    flex-shrink:0;
  }
  .card-title{
    flex:1;
    font-family:var(--font-body);
    font-weight:600;
    font-size:12.5px;
    outline:none;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card-title:focus{white-space:normal; overflow:visible;}
  .card-title:empty:before{content:attr(data-ph); color:var(--card-ink-soft); font-weight:500;}

  .color-dot{
    width:13px;height:13px;border-radius:50%;
    flex-shrink:0;cursor:pointer;
    border:1px solid rgba(0,0,0,.15);
    box-shadow:0 0 0 2px var(--card-bg);
  }
  .color-popover{
    position:absolute; z-index:80;
    top:32px; right:6px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:9px;
    padding:7px;
    display:flex; gap:6px; flex-wrap:wrap; width:120px;
    box-shadow:0 10px 24px rgba(0,0,0,.4);
  }
  .swatch{width:17px;height:17px;border-radius:50%;cursor:pointer;border:1px solid rgba(0,0,0,.2);flex-shrink:0;}
  .swatch:hover{transform:scale(1.15);}
  .swatch.auto{background:var(--panel); position:relative; border:1px solid var(--panel-border);}
  .swatch.auto::after{content:'';position:absolute;left:2px;right:2px;top:50%;height:1px;background:var(--text-faint);transform:rotate(-40deg);}

  .card-del{
    flex-shrink:0;
    width:20px;height:20px;
    border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    color:var(--card-ink-soft);
    cursor:pointer;
    font-size:13px;
    opacity:0;
    transition:.12s;
  }
  .card:hover .card-del{opacity:1;}
  .card-del:hover{background:var(--danger); color:#fff;}

  .card-body{padding:10px 12px 12px;font-size:13px;line-height:1.5;flex:1 1 auto;overflow:auto;}

  /* note */
  .note-text{
    outline:none;
    min-height:40px;
    font-family:var(--font-body);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .note-text:empty:before{content:attr(data-ph); color:var(--card-ink-soft);}

  /* image / video */
  .media-url-row{display:flex;gap:6px;}
  .field-input{
    flex:1;
    font-family:var(--font-mono);
    font-size:11px;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid var(--card-border);
    background:var(--card-bg-2);
    color:var(--card-ink);
    outline:none;
    min-width:0;
  }
  .field-input:focus{border-color:var(--accent);}
  .field-btn{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:6px 9px;
    border-radius:6px;
    border:1px solid var(--card-border);
    background:var(--card-bg-2);
    color:var(--card-ink-soft);
    cursor:pointer;
    flex-shrink:0;
  }
  .field-btn:hover{border-color:var(--accent);color:var(--card-ink);}
  .media-frame{
    width:100%;
    border-radius:6px;
    overflow:hidden;
    background:#000;
    display:block;
    cursor:zoom-in;
  }
  .media-frame img{width:100%;display:block;}
  .media-frame iframe{width:100%; aspect-ratio:16/9; display:block; border:0;}
  .media-caption{
    margin-top:7px;
    font-size:11.5px;
    color:var(--card-ink-soft);
    outline:none;
  }
  .media-caption:empty:before{content:attr(data-ph); color:var(--card-ink-soft);}
  .media-edit-link{
    margin-top:6px;
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:.05em;
    color:var(--card-ink-soft);
    text-transform:uppercase;
    cursor:pointer;
    display:inline-block;
  }
  .media-edit-link:hover{color:var(--card-ink);}
  .media-fallback{
    display:flex;flex-direction:column;gap:2px;
    padding:12px;
    background:var(--card-bg-2);
    border:1px dashed var(--card-border);
    border-radius:6px;
    cursor:pointer;
  }
  .media-fallback .mf-domain{font-family:var(--font-mono);font-size:9.5px;color:var(--card-ink-soft);text-transform:uppercase;letter-spacing:.06em;}
  .media-fallback .mf-title{font-size:12.5px;font-weight:600;word-break:break-word;}

  /* date */
  .date-row{display:flex;align-items:center;gap:8px;}
  .date-input{
    font-family:var(--font-mono);
    font-size:12px;
    padding:6px 8px;
    border-radius:6px;
    border:1px solid var(--card-border);
    background:var(--card-bg-2);
    color:var(--card-ink);
    outline:none;
  }
  .date-input:focus{border-color:var(--accent);}
  .date-display{
    display:flex;flex-direction:column;gap:3px;
  }
  .date-big{font-family:var(--font-display); font-size:19px; font-weight:600;}
  .date-count{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--card-ink-soft);}
  .date-count.urgent{color:var(--danger); font-weight:600;}
  .date-count.done{color:var(--c-checklist); font-weight:600;}
  .date-label{
    outline:none;
    font-size:12.5px;
    margin-top:6px;
    color:var(--card-ink-soft);
  }
  .date-label:empty:before{content:attr(data-ph); color:var(--card-ink-soft);}

  /* checklist */
  .check-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px;}
  .check-item input[type=checkbox]{
    margin-top:3px;
    accent-color:var(--c-checklist);
    cursor:pointer;
    flex-shrink:0;
  }
  .check-item .ci-text{
    flex:1;outline:none;font-size:13px;word-break:break-word;
  }
  .check-item.done .ci-text{color:var(--card-ink-soft); text-decoration:line-through;}
  .check-item .ci-del{
    flex-shrink:0;font-size:12px;color:var(--card-ink-soft);cursor:pointer;opacity:0;
  }
  .check-item:hover .ci-del{opacity:1;}
  .check-item .ci-del:hover{color:var(--danger);}
  .add-check-item{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--card-ink-soft);
    cursor:pointer;
    margin-top:4px;
  }
  .add-check-item:hover{color:var(--card-ink);}

  /* link */
  .link-card-body{
    display:flex;flex-direction:column;gap:2px;
    cursor:pointer;
  }
  .link-title{font-weight:600;font-size:13px;}
  .link-domain{font-family:var(--font-mono); font-size:10px; color:var(--card-ink-soft); text-transform:uppercase; letter-spacing:.05em;}

  /* resize handle */
  .resize-handle{
    position:absolute; right:0; bottom:0;
    width:16px;height:16px;
    cursor:nwse-resize;
    background: linear-gradient(135deg, transparent 0 46%, var(--card-ink-soft) 46% 52%, transparent 52% 61%, var(--card-ink-soft) 61% 67%, transparent 67% 76%, var(--card-ink-soft) 76% 82%, transparent 82% 100%);
    opacity:0;
    transition:opacity .12s;
    border-bottom-right-radius:var(--radius);
  }
  .card:hover .resize-handle{opacity:.6;}
  .resize-handle:hover{opacity:1 !important;}

  /* ---------- SNAP GUIDES ---------- */
  .snap-guide{
    position:absolute;
    background:var(--accent);
    pointer-events:none;
    z-index:40;
    display:none;
    box-shadow:0 0 6px rgba(232,163,61,0.6);
  }
  .snap-guide-v{ width:1px; top:-4000px; height:8000px; }
  .snap-guide-h{ height:1px; left:-4000px; width:8000px; }

  /* ---------- FAB ---------- */
  .fab-wrap{position:fixed; right:28px; bottom:28px; z-index:100;}
  .fab{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    font-size:26px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(232,163,61,0.35);
    transition:transform .15s;
  }
  .fab:hover{transform:scale(1.06);}
  .fab.open{transform:rotate(45deg);}

  .fab-menu{
    position:absolute;
    bottom:64px;
    right:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    opacity:0;
    pointer-events:none;
    transform:translateY(8px);
    transition:.15s;
  }
  .fab-menu.open{opacity:1;pointer-events:auto;transform:translateY(0);}
  .fab-item{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    padding:8px 14px 8px 10px;
    border-radius:9px;
    cursor:pointer;
    white-space:nowrap;
    transition:.12s;
  }
  .fab-item:hover{border-color:var(--accent); transform:translateX(-2px);}
  .fab-item .fi-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .fab-item .fi-label{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-hi);
  }

  /* ---------- PRINT ---------- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important; position:absolute; left:0; top:0; margin:0; padding:0;}
    body{overflow:visible !important; background:#fff;}
    @page{margin:12mm;}
  }
  .print-board-title{font-family:var(--font-display); font-size:24px; font-weight:700; margin:0 0 4px; color:#111;}
  .print-board-sub{font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#999; margin-bottom:10px;}
  .print-phase{page-break-after:always;}
  .print-phase:last-child{page-break-after:auto;}
  .print-phase-header{display:flex; align-items:baseline; gap:10px; margin:22px 0 12px;}
  .pp-index{font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color:#999;}
  .pp-name{font-family:var(--font-mono); font-size:16px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#111;}
  .print-board{position:relative; border:1px solid #ddd; background:#fbfaf7; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .print-empty{padding:22px; font-family:var(--font-mono); font-size:11px; color:#999;}
  .print-card{
    position:absolute; background:#fff; border:1px solid #ddd; border-left:4px solid #999;
    border-radius:6px; overflow:hidden;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  .print-card-head{padding:6px 8px; border-bottom:1px solid #eee;}
  .pc-tag{font-family:var(--font-mono); font-size:8px; text-transform:uppercase; letter-spacing:.08em; color:#999; margin-right:6px;}
  .pc-title{font-weight:700; font-size:11px; color:#111;}
  .print-card-body{padding:8px; font-size:10.5px; color:#222; white-space:pre-wrap; word-break:break-word;}
  .pc-img{width:100%; display:block; border-radius:4px;}
  .pc-caption{margin-top:4px; font-size:9.5px; color:#777;}
  .pc-check{font-size:10.5px; margin-bottom:3px;}
  .pc-linkbox{font-size:10px; word-break:break-all;}
  .pc-domain{font-family:var(--font-mono); font-size:9px; color:#888; text-transform:uppercase;}
  .pc-date-big{font-family:var(--font-display); font-size:15px; font-weight:700; color:#111;}

  /* scrollbars */
  .card-body::-webkit-scrollbar{width:8px;}
  .card-body::-webkit-scrollbar-thumb{background:#00000022;border-radius:6px;}

  /* ---------- STARTUP OVERLAY / MODAL ---------- */
  #startupOverlay{
    position:fixed; inset:0; z-index:9999;
    background:rgba(10,11,11,0.72);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  #startupOverlay.hidden{display:none;}
  .startup-modal{
    width:100%; max-width:440px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:28px 26px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
    font-family:var(--font-body);
  }
  .startup-eyebrow{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.14em;
    color:var(--text-faint); text-transform:uppercase; margin-bottom:6px;
  }
  .startup-title{
    font-family:var(--font-display); font-weight:600; font-size:22px;
    color:var(--text-hi); margin-bottom:8px;
  }
  .startup-desc{
    font-size:13px; line-height:1.5; color:var(--text-lo); margin-bottom:20px;
  }
  .startup-field{margin-bottom:14px;}
  .startup-field label{
    display:block; font-size:11.5px; font-weight:600; color:var(--text-lo);
    margin-bottom:6px;
  }
  .startup-field input, .startup-field textarea{
    width:100%; background:var(--bg-2); border:1px solid var(--panel-border);
    border-radius:8px; color:var(--text-hi); font-family:var(--font-body);
    font-size:13.5px; padding:9px 11px; outline:none; resize:vertical;
  }
  .startup-field input:focus, .startup-field textarea:focus{border-color:var(--accent);}
  .startup-field textarea{min-height:70px;}
  .startup-note{
    display:flex; gap:8px; font-size:11.5px; line-height:1.5; color:var(--text-faint);
    background:var(--bg-2); border:1px solid var(--panel-border); border-radius:8px;
    padding:10px 11px; margin-bottom:18px;
  }
  .startup-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;}
  .startup-btn{
    font-family:var(--font-body); font-size:13px; font-weight:600;
    padding:10px 18px; border-radius:8px; cursor:pointer; border:1px solid transparent;
    transition:.15s;
  }
  .startup-btn.primary{background:var(--accent); color:var(--accent-ink);}
  .startup-btn.primary:hover{filter:brightness(1.06);}
  .startup-btn.primary:disabled{opacity:.5; cursor:not-allowed;}
  .startup-btn.ghost{background:transparent; color:var(--text-lo); border-color:var(--panel-border);}
  .startup-btn.ghost:hover{color:var(--text-hi); border-color:var(--accent);}
  .startup-error{
    font-size:12px; color:var(--danger); margin:-6px 0 14px; display:none;
  }
  .startup-error.show{display:block;}
  .startup-project-name{
    font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--text-hi);
    margin-bottom:4px;
  }
  .startup-project-details{
    font-size:12.5px; color:var(--text-lo); margin-bottom:18px; white-space:pre-wrap;
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="eyebrow" id="projectEyebrow" title="Detalhes do projeto">Painel de produção criativa · 📁 salvando localmente</div>
      <div id="boardTitle" contenteditable="true" spellcheck="false">Quadro Criativo</div>
    </div>
    <div class="top-actions">
      <button class="text-btn" id="openBtn" title="Abrir um arquivo de quadro salvo">⇧ Abrir</button>
      <button class="text-btn" id="downloadBtn" title="Salvar e baixar este quadro como arquivo">⇩ Baixar</button>
      <button class="text-btn" id="printBtn" title="Imprimir todas as fases">⎙ Imprimir</button>
      <div class="icon-btn" id="resetBtn" title="Reiniciar quadro">↺</div>
      <input type="file" id="fileInput" accept="application/json,.json" style="display:none">
    </div>
  </div>

  <div class="phase-bar" id="phaseBar"></div>

  <div class="canvas-wrap" id="canvasWrap">
    <div id="canvas"></div>
  </div>
</div>

<div class="zoom-controls">
  <button class="zc-btn" id="zoomInBtn" title="Aproximar (zoom +)">+</button>
  <button class="zc-btn label" id="zoomLabelBtn" title="Redefinir para 100%">100%</button>
  <button class="zc-btn" id="zoomOutBtn" title="Afastar (zoom −)">−</button>
  <div class="zc-sep"></div>
  <button class="zc-btn focus-btn disabled" id="focusBtn" title="Selecione um card e clique aqui para focar nele">◎</button>
</div>

<div class="fab-wrap">
  <div class="fab-menu" id="fabMenu">
    <div class="fab-item" data-type="note"><span class="fi-dot" style="background:var(--c-note)"></span><span class="fi-label">Nota</span></div>
    <div class="fab-item" data-type="image"><span class="fi-dot" style="background:var(--c-image)"></span><span class="fi-label">Imagem</span></div>
    <div class="fab-item" data-type="video"><span class="fi-dot" style="background:var(--c-video)"></span><span class="fi-label">Vídeo</span></div>
    <div class="fab-item" data-type="date"><span class="fi-dot" style="background:var(--c-date)"></span><span class="fi-label">Data / prazo</span></div>
    <div class="fab-item" data-type="checklist"><span class="fi-dot" style="background:var(--c-checklist)"></span><span class="fi-label">Checklist</span></div>
    <div class="fab-item" data-type="link"><span class="fi-dot" style="background:var(--c-link)"></span><span class="fi-label">Link</span></div>
  </div>
  <button class="fab" id="fabBtn">+</button>
</div>

<div id="printArea"></div>

<div id="startupOverlay" class="hidden"></div>

<script>
(function(){
  "use strict";

  const TYPE_DEFAULT_HEX = {
    note:'#8FA694', image:'#5E93C2', video:'#A084C9',
    date:'#E8A33D', checklist:'#4FA085', link:'#D97B4E'
  };
  const TYPE_LABEL = {
    note:'Nota', image:'Imagem', video:'Vídeo', date:'Data', checklist:'Checklist', link:'Link'
  };
  const PALETTE = ['#8FA694','#5E93C2','#A084C9','#E8A33D','#4FA085','#D97B4E','#CC5A45','#B9B4A5'];

  const DEFAULT_PHASES = [
    {id:'p1', name:'Fase Inicial'},
    {id:'p2', name:'Edição'},
    {id:'p3', name:'Finalização'},
    {id:'p4', name:'Render'},
    {id:'p5', name:'Entrega'}
  ];

  let state = {
    title: 'Quadro Criativo',
    details: '',
    phases: [],
    activePhase: null,
  };
  let cardsCache = {}; // phaseId -> array of cards (loaded lazily)
  let placeCounter = {};
  let selectedCardId = null;
  let view = { zoom: 1, panX: 100, panY: 80 };

  const canvasWrap = document.getElementById('canvasWrap');
  const canvasEl = document.getElementById('canvas');

  const $ = (sel, root) => (root||document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root||document).querySelectorAll(sel));
  const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------- ARMAZENAMENTO LOCAL (pasta no computador do usuário, sem banco de dados) ----------------
  const IDB_NAME = 'quadro-criativo-fs';
  const IDB_STORE = 'handles';
  const BOARD_FILENAME = 'quadro-criativo.json';
  const MEDIA_DIRNAME = 'midia';

  let dirHandle = null;      // FileSystemDirectoryHandle da pasta do projeto escolhida pelo usuário
  let mediaDirHandle = null; // subpasta "midia" dentro da pasta do projeto
  let writeQueue = Promise.resolve(); // serializa gravações no arquivo local

  function openHandleDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSet(key, value){
    const db = await openHandleDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGet(key){
    const db = await openHandleDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbDelete(key){
    const db = await openHandleDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function verifyPermission(handle, mode){
    const opts = { mode: mode || 'readwrite' };
    try{
      if((await handle.queryPermission(opts)) === 'granted') return true;
      if((await handle.requestPermission(opts)) === 'granted') return true;
    }catch(e){ /* handle pode ter sido revogado/apagado */ }
    return false;
  }

  async function ensureMediaDir(){
    if(!mediaDirHandle) mediaDirHandle = await dirHandle.getDirectoryHandle(MEDIA_DIRNAME, {create:true});
    return mediaDirHandle;
  }

  async function readBoardFile(){
    try{
      const fh = await dirHandle.getFileHandle(BOARD_FILENAME);
      const file = await fh.getFile();
      const text = await file.text();
      return JSON.parse(text);
    }catch(e){ return null; }
  }

  async function writeBoardFileNow(){
    if(!dirHandle) return;
    const fh = await dirHandle.getFileHandle(BOARD_FILENAME, {create:true});
    const writable = await fh.createWritable();
    const data = {
      app: 'quadro-criativo',
      version: 1,
      savedAt: new Date().toISOString(),
      title: state.title,
      details: state.details || '',
      phases: state.phases,
      activePhase: state.activePhase,
      cards: state.phases.reduce((acc, p) => {
        acc[p.id] = cardsCache[p.id] || [];
        return acc;
      }, {})
    };
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
  }
  // Serializa as gravações para evitar duas escritas simultâneas no mesmo arquivo
  function writeBoardFile(){
    writeQueue = writeQueue.then(writeBoardFileNow).catch(err => console.error('Falha ao salvar na pasta local', err));
    return writeQueue;
  }

  // Salva um arquivo (imagem, vídeo ou áudio) enviado pelo usuário dentro da pasta "midia"
  async function saveMediaFile(file){
    await ensureMediaDir();
    const ext = (file.name && file.name.includes('.')) ? file.name.slice(file.name.lastIndexOf('.')) : '';
    const safeName = uid() + ext;
    const fh = await mediaDirHandle.getFileHandle(safeName, {create:true});
    const writable = await fh.createWritable();
    await writable.write(file);
    await writable.close();
    return { fileName: safeName, mimeType: file.type || '' };
  }
  // Recupera um arquivo salvo localmente e gera uma URL temporária para exibição
  async function getMediaObjectURL(fileName){
    await ensureMediaDir();
    const fh = await mediaDirHandle.getFileHandle(fileName);
    const file = await fh.getFile();
    return URL.createObjectURL(file);
  }

  async function saveMeta(){ await writeBoardFile(); }
  async function saveCards(phaseId){ await writeBoardFile(); }
  async function loadCards(phaseId){
    if(!cardsCache[phaseId]) cardsCache[phaseId] = [];
    return cardsCache[phaseId];
  }

  // ---------------- PHASE COLOR (progression gradient) ----------------
  function phaseHue(index, total){
    if(total <= 1) return 205;
    const t = index/(total-1);
    return Math.round(205 - (205-3)*t);
  }
  function phaseColor(index, total){
    return `hsl(${phaseHue(index,total)}, 58%, 56%)`;
  }

  // ---------------- INICIALIZAÇÃO DO QUADRO (depois que a pasta local já está definida) ----------------
  function freshPhases(){
    state.phases = DEFAULT_PHASES.map(p => ({...p}));
    state.activePhase = state.phases[0].id;
    cardsCache = {};
    state.phases.forEach(p => cardsCache[p.id] = []);
  }

  async function startApp(){
    $('#boardTitle').textContent = state.title;
    const eyebrow = $('#projectEyebrow');
    if(eyebrow) eyebrow.title = state.details ? ('Detalhes do projeto: ' + state.details) : 'Nenhum detalhe adicionado ao projeto.';
    await loadCards(state.activePhase);
    renderPhaseBar();
    renderCanvas();
    applyTransform();
    setupPanZoom();
  }

  // ---------------- POPUP INICIAL: escolha/uso da pasta local do projeto ----------------
  const overlay = document.getElementById('startupOverlay');
  function showOverlay(html){
    overlay.innerHTML = html;
    overlay.classList.remove('hidden');
  }
  function hideOverlay(){
    overlay.classList.add('hidden');
    overlay.innerHTML = '';
  }

  function renderUnsupportedModal(){
    showOverlay(`
      <div class="startup-modal">
        <div class="startup-eyebrow">Quadro Criativo</div>
        <div class="startup-title">Navegador não suportado</div>
        <div class="startup-desc">
          Para salvar tudo localmente numa pasta do seu computador (sem usar nenhum banco de dados),
          este quadro precisa de um navegador com suporte ao acesso ao sistema de arquivos —
          como <b>Google Chrome</b> ou <b>Microsoft Edge</b> (versões recentes, em um site com https:// ou localhost).
        </div>
        <div class="startup-actions">
          <button class="startup-btn primary" id="btnRetrySupport">Tentar novamente</button>
        </div>
      </div>
    `);
    document.getElementById('btnRetrySupport').addEventListener('click', boot);
  }

  function renderNewProjectModal(prefill){
    showOverlay(`
      <div class="startup-modal">
        <div class="startup-eyebrow">Quadro Criativo</div>
        <div class="startup-title">Iniciar novo projeto</div>
        <div class="startup-desc">Dê um nome ao projeto e escolha (ou crie) uma pasta no seu computador. Tudo que você adicionar — notas, imagens, vídeos, áudios etc. — será salvo automaticamente nessa pasta, no seu próprio computador.</div>
        <div class="startup-field">
          <label for="spName">Nome do projeto</label>
          <input type="text" id="spName" placeholder="Ex.: Comercial de Verão 2026" value="${escapeHtml(prefill && prefill.name || '')}">
        </div>
        <div class="startup-field">
          <label for="spDetails">Detalhes</label>
          <textarea id="spDetails" placeholder="Breve descrição, briefing, contexto do projeto...">${escapeHtml(prefill && prefill.details || '')}</textarea>
        </div>
        <div class="startup-note">📁 Ao clicar em "Iniciar projeto", o navegador vai pedir para você <b>selecionar ou criar uma pasta</b>. Autorize o acesso — é nela que tudo será salvo, localmente, sem nuvem e sem banco de dados.</div>
        <div class="startup-error" id="spError">Não foi possível acessar a pasta. Tente novamente.</div>
        <div class="startup-actions">
          <button class="startup-btn primary" id="spStart">Iniciar projeto</button>
        </div>
      </div>
    `);
    const nameInput = document.getElementById('spName');
    const startBtn = document.getElementById('spStart');
    const errEl = document.getElementById('spError');
    nameInput.focus();
    startBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim() || 'Quadro Criativo';
      const details = document.getElementById('spDetails').value.trim();
      errEl.classList.remove('show');
      startBtn.disabled = true;
      startBtn.textContent = 'Aguardando pasta...';
      try{
        const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
        const ok = await verifyPermission(handle, 'readwrite');
        if(!ok) throw new Error('permissão negada');
        dirHandle = handle;
        mediaDirHandle = null;
        await idbSet('projectDirHandle', dirHandle);
        await idbSet('projectInfo', { name, details });
        state.title = name;
        state.details = details;
        freshPhases();
        await ensureMediaDir();
        await writeBoardFile();
        hideOverlay();
        await startApp();
      }catch(err){
        // usuário cancelou a escolha da pasta, ou a permissão foi negada
        startBtn.disabled = false;
        startBtn.textContent = 'Iniciar projeto';
        if(err && err.name !== 'AbortError'){
          errEl.classList.add('show');
        }
      }
    });
  }

  function renderContinueModal(info){
    showOverlay(`
      <div class="startup-modal">
        <div class="startup-eyebrow">Quadro Criativo</div>
        <div class="startup-title">Continuar projeto</div>
        <div class="startup-project-name">${escapeHtml(info && info.name || 'Quadro Criativo')}</div>
        ${info && info.details ? `<div class="startup-project-details">${escapeHtml(info.details)}</div>` : ''}
        <div class="startup-desc">Este quadro já está vinculado a uma pasta local. Conceda acesso a ela novamente para continuar de onde você parou, ou comece um novo projeto em outra pasta.</div>
        <div class="startup-error" id="cpError">Não foi possível acessar essa pasta (ela pode ter sido movida, renomeada ou apagada).</div>
        <div class="startup-actions">
          <button class="startup-btn ghost" id="cpNew">Novo projeto</button>
          <button class="startup-btn primary" id="cpContinue">Conceder acesso e continuar</button>
        </div>
      </div>
    `);
    const errEl = document.getElementById('cpError');
    document.getElementById('cpNew').addEventListener('click', async () => {
      await idbDelete('projectDirHandle');
      await idbDelete('projectInfo');
      dirHandle = null; mediaDirHandle = null;
      renderNewProjectModal(info);
    });
    document.getElementById('cpContinue').addEventListener('click', async () => {
      errEl.classList.remove('show');
      try{
        const ok = await verifyPermission(dirHandle, 'readwrite');
        if(!ok) throw new Error('permissão negada');
        await ensureMediaDir();
        const data = await readBoardFile();
        if(data && Array.isArray(data.phases) && data.phases.length){
          state.title = data.title || (info && info.name) || 'Quadro Criativo';
          state.details = data.details || (info && info.details) || '';
          state.phases = data.phases;
          state.activePhase = (data.activePhase && data.phases.some(p=>p.id===data.activePhase)) ? data.activePhase : data.phases[0].id;
          cardsCache = {};
          state.phases.forEach(p => cardsCache[p.id] = (data.cards && data.cards[p.id]) || []);
        } else {
          state.title = (info && info.name) || 'Quadro Criativo';
          state.details = (info && info.details) || '';
          freshPhases();
          await writeBoardFile();
        }
        hideOverlay();
        await startApp();
      }catch(err){
        errEl.classList.add('show');
      }
    });
  }

  async function boot(){
    if(!window.showDirectoryPicker){
      renderUnsupportedModal();
      return;
    }
    const savedHandle = await idbGet('projectDirHandle').catch(() => null);
    const savedInfo = await idbGet('projectInfo').catch(() => null);
    if(savedHandle){
      dirHandle = savedHandle;
      renderContinueModal(savedInfo);
    } else {
      renderNewProjectModal(null);
    }
  }

  // ---------------- BOARD TITLE ----------------
  $('#boardTitle').addEventListener('blur', () => {
    const t = $('#boardTitle').textContent.trim() || 'Quadro Criativo';
    state.title = t;
    $('#boardTitle').textContent = t;
    saveMeta();
  });
  $('#boardTitle').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); $('#boardTitle').blur(); }
  });

  // ---------------- RESET ----------------
  $('#resetBtn').addEventListener('click', async () => {
    if(!confirm('Isso vai apagar todas as fases e cards do quadro (o conteúdo salvo na pasta local também será substituído). Deseja continuar?')) return;
    state.title = 'Quadro Criativo';
    state.details = '';
    freshPhases();
    selectedCardId = null;
    await saveMeta();
    $('#boardTitle').textContent = state.title;
    await loadCards(state.activePhase);
    renderPhaseBar();
    renderCanvas();
  });

  // ---------------- PHASE BAR ----------------
  function renderPhaseBar(){
    const bar = $('#phaseBar');
    bar.innerHTML = '';
    state.phases.forEach((phase, i) => {
      const tab = document.createElement('div');
      tab.className = 'phase-tab' + (phase.id === state.activePhase ? ' active' : '');
      tab.draggable = true;
      tab.dataset.id = phase.id;

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = phaseColor(i, state.phases.length);
      tab.appendChild(dot);

      const label = document.createElement('span');
      label.textContent = phase.name;
      label.className = 'tab-label';
      tab.appendChild(label);

      const close = document.createElement('span');
      close.className = 'close-tab';
      close.textContent = '✕';
      close.title = 'Excluir fase';
      close.addEventListener('click', async (e) => {
        e.stopPropagation();
        if(state.phases.length <= 1){ alert('É preciso manter ao menos uma fase.'); return; }
        if(!confirm(`Excluir a fase "${phase.name}" e todos os cards nela?`)) return;
        delete cardsCache[phase.id];
        state.phases = state.phases.filter(p => p.id !== phase.id);
        if(state.activePhase === phase.id){
          state.activePhase = state.phases[0].id;
          await loadCards(state.activePhase);
        }
        await saveMeta();
        renderPhaseBar();
        renderCanvas();
      });
      tab.appendChild(close);

      tab.addEventListener('click', async () => {
        if(tab.getAttribute('contenteditable') === 'true') return;
        if(state.activePhase === phase.id) return;
        state.activePhase = phase.id;
        selectedCardId = null;
        await saveMeta();
        await loadCards(phase.id);
        renderPhaseBar();
        renderCanvas();
      });

      tab.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        tab.setAttribute('contenteditable', 'true');
        label.focus();
        document.execCommand('selectAll', false, null);
      });
      label.addEventListener('blur', async () => {
        tab.removeAttribute('contenteditable');
        const newName = label.textContent.trim() || phase.name;
        phase.name = newName;
        label.textContent = newName;
        await saveMeta();
      });
      label.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); label.blur(); }
      });

      // drag reorder
      tab.addEventListener('dragstart', e => {
        tab.classList.add('dragging');
        e.dataTransfer.setData('text/plain', phase.id);
      });
      tab.addEventListener('dragend', () => tab.classList.remove('dragging'));
      tab.addEventListener('dragover', e => e.preventDefault());
      tab.addEventListener('drop', async e => {
        e.preventDefault();
        const draggedId = e.dataTransfer.getData('text/plain');
        if(draggedId === phase.id) return;
        const fromIdx = state.phases.findIndex(p => p.id === draggedId);
        const toIdx = state.phases.findIndex(p => p.id === phase.id);
        const [moved] = state.phases.splice(fromIdx, 1);
        state.phases.splice(toIdx, 0, moved);
        await saveMeta();
        renderPhaseBar();
      });

      bar.appendChild(tab);
    });

    const addBtn = document.createElement('div');
    addBtn.className = 'add-phase';
    addBtn.textContent = '+';
    addBtn.title = 'Nova fase';
    addBtn.addEventListener('click', async () => {
      const id = 'p' + uid();
      const name = 'Nova Fase';
      state.phases.push({id, name});
      state.activePhase = id;
      cardsCache[id] = [];
      await saveMeta();
      await saveCards(id);
      renderPhaseBar();
      renderCanvas();
      requestAnimationFrame(() => {
        const t = $(`.phase-tab[data-id="${id}"] .tab-label`);
        if(t){
          const tab = t.closest('.phase-tab');
          tab.setAttribute('contenteditable','true');
          t.focus();
          document.execCommand('selectAll', false, null);
        }
      });
    });
    bar.appendChild(addBtn);

    const idx = state.phases.findIndex(p => p.id === state.activePhase);
    const prog = document.createElement('div');
    prog.className = 'phase-progress';
    prog.textContent = `FASE ${idx+1} DE ${state.phases.length}`;
    bar.appendChild(prog);
  }

  // ---------------- CANVAS / CARDS ----------------
  function buildEmptyHint(){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML = `<b>Essa fase ainda está vazia.</b><br>Clique no botão <b>+</b> no canto inferior direito para adicionar notas, imagens, vídeos, prazos, checklists ou links. Arraste os cards pelo cabeçalho para mover, puxe o canto para redimensionar, e use a bolinha colorida para trocar a cor.`;
    return hint;
  }

  function renderCanvas(){
    canvasEl.innerHTML = '';
    const cards = cardsCache[state.activePhase] || [];
    if(cards.length === 0){
      canvasEl.appendChild(buildEmptyHint());
    }
    cards.forEach(card => canvasEl.appendChild(buildCardEl(card)));
    updateFocusBtnState();
  }

  // Atualiza só o corpo de UM card específico, sem tocar em nenhum outro card já renderizado.
  function refreshCardBody(card){
    const el = canvasEl.querySelector(`.card[data-id="${card.id}"]`);
    if(!el) return;
    const body = el.querySelector('.card-body');
    body.innerHTML = '';
    body.appendChild(buildBody(card));
  }

  function screenToWorld(sx, sy){
    return { x: (sx - view.panX) / view.zoom, y: (sy - view.panY) / view.zoom };
  }

  // Nova posição: sempre no centro da área visível da tela, com um leve espiral
  // para o caso de vários cards serem adicionados em sequência sem se sobrepor.
  function nextPosition(type){
    const phaseId = state.activePhase;
    placeCounter[phaseId] = (placeCounter[phaseId] || 0) + 1;
    const n = placeCounter[phaseId] - 1;
    const rect = canvasWrap.getBoundingClientRect();
    const center = screenToWorld(rect.width/2, rect.height/2);
    const w = (type === 'image' || type === 'video') ? 290 : 250;
    const h = 130;
    const angle = n * 0.85;
    const radius = Math.min(n, 8) * 16;
    const jitterX = n === 0 ? 0 : Math.cos(angle) * radius;
    const jitterY = n === 0 ? 0 : Math.sin(angle) * radius;
    return { x: center.x - w/2 + jitterX, y: center.y - h/2 + jitterY };
  }

  async function addCard(type){
    const pos = nextPosition(type);
    const base = { id: uid(), type, title: '', x: pos.x, y: pos.y, w: null, h: null, color: null };
    let content = {};
    if(type === 'note') content = {text:''};
    if(type === 'image') content = {url:'', fileName:'', mimeType:'', caption:''};
    if(type === 'video') content = {url:'', fileName:'', mimeType:'', caption:''};
    if(type === 'date') content = {date:'', label:''};
    if(type === 'checklist') content = {items:[{id:uid(), text:'', done:false}]};
    if(type === 'link') content = {url:'', label:''};
    const card = {...base, content};
    const cards = cardsCache[state.activePhase];
    cards.push(card);
    await saveCards(state.activePhase);

    // Insere só o novo card no DOM — não recria nem reformata os cards existentes.
    if(cards.length === 1){
      canvasEl.innerHTML = '';
    }
    canvasEl.appendChild(buildCardEl(card));
    selectCard(card.id);

    requestAnimationFrame(() => {
      const el = $(`.card[data-id="${card.id}"] .card-title`);
      if(el) el.focus();
    });
  }

  function debounce(fn, wait){
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), wait); };
  }
  const debouncedSave = debounce(() => saveCards(state.activePhase), 400);

  function getCard(id){
    return (cardsCache[state.activePhase]||[]).find(c => c.id === id);
  }

  function extractYoutube(url){
    const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function extractVimeo(url){
    const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    return m ? m[1] : null;
  }
  function domainOf(url){
    try{ return new URL(url).hostname.replace('www.',''); }catch(e){ return url; }
  }

  function cardAccentColor(card){
    return card.color || TYPE_DEFAULT_HEX[card.type];
  }

  function closeAllColorPopovers(){
    $$('.color-popover').forEach(p => p.remove());
  }

  function buildCardEl(card){
    const el = document.createElement('div');
    el.className = 'card' + (card.id === selectedCardId ? ' selected' : '');
    el.dataset.id = card.id;
    el.dataset.type = card.type;
    el.style.left = card.x + 'px';
    el.style.top = card.y + 'px';
    if(card.w) el.style.width = card.w + 'px';
    if(card.h) el.style.height = card.h + 'px';
    el.style.borderLeftColor = cardAccentColor(card);

    // select on click (ignore interactive children)
    el.addEventListener('click', (e) => {
      if(e.target.closest('.card-del') || e.target.closest('.resize-handle') ||
         e.target.closest('.color-dot') || e.target.closest('.color-popover') ||
         e.target.isContentEditable) return;
      selectCard(card.id);
    });

    // head
    const head = document.createElement('div');
    head.className = 'card-head';

    const tag = document.createElement('span');
    tag.className = 'type-tag';
    tag.textContent = TYPE_LABEL[card.type];
    head.appendChild(tag);

    const title = document.createElement('div');
    title.className = 'card-title';
    title.contentEditable = 'true';
    title.spellcheck = false;
    title.dataset.ph = 'Sem título';
    title.textContent = card.title || '';
    title.addEventListener('input', () => { card.title = title.textContent; debouncedSave(); });
    title.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); title.blur(); } });
    head.appendChild(title);

    // color dot + popover
    const colorDot = document.createElement('div');
    colorDot.className = 'color-dot';
    colorDot.style.background = cardAccentColor(card);
    colorDot.title = 'Cor do card';
    colorDot.addEventListener('click', (e) => {
      e.stopPropagation();
      const existing = head.querySelector('.color-popover');
      closeAllColorPopovers();
      if(existing) return; // was open -> just closed it
      const pop = document.createElement('div');
      pop.className = 'color-popover';
      PALETTE.forEach(hex => {
        const sw = document.createElement('div');
        sw.className = 'swatch';
        sw.style.background = hex;
        sw.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          card.color = hex;
          el.style.borderLeftColor = hex;
          colorDot.style.background = hex;
          pop.remove();
          await saveCards(state.activePhase);
        });
        pop.appendChild(sw);
      });
      const auto = document.createElement('div');
      auto.className = 'swatch auto';
      auto.title = 'Cor padrão do tipo';
      auto.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        card.color = null;
        const def = TYPE_DEFAULT_HEX[card.type];
        el.style.borderLeftColor = def;
        colorDot.style.background = def;
        pop.remove();
        await saveCards(state.activePhase);
      });
      pop.appendChild(auto);
      head.appendChild(pop);
    });
    head.appendChild(colorDot);

    const del = document.createElement('div');
    del.className = 'card-del';
    del.textContent = '✕';
    del.title = 'Excluir card';
    del.addEventListener('click', async (e) => {
      e.stopPropagation();
      const arr = cardsCache[state.activePhase];
      const idx = arr.findIndex(c => c.id === card.id);
      if(idx > -1) arr.splice(idx,1);
      if(selectedCardId === card.id) selectedCardId = null;
      await saveCards(state.activePhase);
      el.remove();
      if(arr.length === 0){
        canvasEl.innerHTML = '';
        canvasEl.appendChild(buildEmptyHint());
      }
      updateFocusBtnState();
    });
    head.appendChild(del);

    el.appendChild(head);
    enableDrag(el, head, card);

    // body
    const body = document.createElement('div');
    body.className = 'card-body';
    body.appendChild(buildBody(card));
    el.appendChild(body);

    // resize handle
    const rh = document.createElement('div');
    rh.className = 'resize-handle';
    el.appendChild(rh);
    enableResize(el, rh, card);

    return el;
  }

  function buildBody(card){
    const wrap = document.createElement('div');
    if(card.type === 'note') buildNoteBody(wrap, card);
    else if(card.type === 'image') buildMediaBody(wrap, card, 'image');
    else if(card.type === 'video') buildMediaBody(wrap, card, 'video');
    else if(card.type === 'date') buildDateBody(wrap, card);
    else if(card.type === 'checklist') buildChecklistBody(wrap, card);
    else if(card.type === 'link') buildLinkBody(wrap, card);
    return wrap;
  }

  function buildNoteBody(wrap, card){
    const t = document.createElement('div');
    t.className = 'note-text';
    t.contentEditable = 'true';
    t.spellcheck = false;
    t.dataset.ph = 'Escreva sua ideia aqui...';
    t.textContent = card.content.text || '';
    t.addEventListener('input', () => { card.content.text = t.textContent; debouncedSave(); });
    wrap.appendChild(t);
  }

  function buildMediaBody(wrap, card, kind){
    const c = card.content;

    // Nenhuma mídia definida ainda: oferece upload de arquivo local (salvo na pasta do projeto) OU URL
    if(!c.url && !c.fileName){
      const uploadRow = document.createElement('div');
      uploadRow.className = 'media-url-row';
      const uploadBtn = document.createElement('button');
      uploadBtn.className = 'field-btn';
      uploadBtn.style.flex = '1';
      uploadBtn.textContent = kind === 'image' ? '📁 Enviar imagem do computador' : '📁 Enviar vídeo/áudio do computador';
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.style.display = 'none';
      fileInput.accept = kind === 'image' ? 'image/*' : 'video/*,audio/*';
      uploadBtn.addEventListener('click', () => {
        if(!dirHandle){ alert('Nenhuma pasta de projeto está ativa.'); return; }
        fileInput.click();
      });
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files && fileInput.files[0];
        fileInput.value = '';
        if(!file) return;
        uploadBtn.disabled = true;
        uploadBtn.textContent = 'Salvando na pasta local...';
        try{
          const saved = await saveMediaFile(file);
          c.fileName = saved.fileName;
          c.mimeType = saved.mimeType;
          c.url = '';
          await saveCards(state.activePhase);
          refreshCardBody(card);
        }catch(err){
          alert('Não foi possível salvar o arquivo na pasta local. Tente novamente.');
          uploadBtn.disabled = false;
          uploadBtn.textContent = kind === 'image' ? '📁 Enviar imagem do computador' : '📁 Enviar vídeo/áudio do computador';
        }
      });
      uploadRow.appendChild(uploadBtn);
      uploadRow.appendChild(fileInput);
      wrap.appendChild(uploadRow);

      const orDiv = document.createElement('div');
      orDiv.style.cssText = 'font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);text-align:center;margin:6px 0;letter-spacing:.08em;';
      orDiv.textContent = 'OU';
      wrap.appendChild(orDiv);

      const row = document.createElement('div');
      row.className = 'media-url-row';
      const input = document.createElement('input');
      input.className = 'field-input';
      input.placeholder = kind === 'image' ? 'Cole a URL da imagem...' : 'Cole a URL do vídeo (YouTube, Vimeo ou link)...';
      const btn = document.createElement('button');
      btn.className = 'field-btn';
      btn.textContent = 'OK';
      const commit = async () => {
        const v = input.value.trim();
        if(!v) return;
        c.url = v;
        c.fileName = '';
        await saveCards(state.activePhase);
        refreshCardBody(card);
      };
      btn.addEventListener('click', commit);
      input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); commit(); } });
      row.appendChild(input); row.appendChild(btn);
      wrap.appendChild(row);
      return;
    }

    // Arquivo salvo localmente na pasta "midia" do projeto
    if(c.fileName){
      const isAudio = (c.mimeType || '').startsWith('audio/');
      const frame = document.createElement('div');
      frame.className = 'media-frame';
      const loading = document.createElement('div');
      loading.className = 'media-fallback';
      loading.textContent = 'Carregando da pasta local...';
      frame.appendChild(loading);
      wrap.appendChild(frame);

      getMediaObjectURL(c.fileName).then(objUrl => {
        frame.innerHTML = '';
        let el;
        if(kind === 'image'){
          el = document.createElement('img');
          el.src = objUrl;
          el.alt = card.title || 'imagem';
        } else if(isAudio){
          el = document.createElement('audio');
          el.controls = true;
          el.src = objUrl;
          el.style.width = '100%';
        } else {
          el = document.createElement('video');
          el.controls = true;
          el.src = objUrl;
          el.style.width = '100%';
        }
        frame.appendChild(el);
      }).catch(() => {
        frame.innerHTML = '';
        frame.appendChild(buildFallback('#', 'Arquivo não encontrado na pasta local (' + c.fileName + ')'));
      });
    } else if(kind === 'image'){
      const frame = document.createElement('div');
      frame.className = 'media-frame';
      const img = document.createElement('img');
      img.src = c.url;
      img.alt = card.title || 'imagem';
      img.addEventListener('error', () => {
        frame.remove();
        wrap.insertBefore(buildFallback(c.url, 'Imagem indisponível'), wrap.firstChild);
      });
      img.addEventListener('click', () => window.open(c.url, '_blank'));
      frame.appendChild(img);
      wrap.appendChild(frame);
    } else {
      const yt = extractYoutube(c.url);
      const vm = extractVimeo(c.url);
      if(yt || vm){
        const frame = document.createElement('div');
        frame.className = 'media-frame';
        const iframe = document.createElement('iframe');
        iframe.src = yt ? `https://www.youtube.com/embed/${yt}` : `https://player.vimeo.com/video/${vm}`;
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        frame.appendChild(iframe);
        wrap.appendChild(frame);
      } else {
        wrap.appendChild(buildFallback(c.url, card.title || 'Abrir vídeo'));
      }
    }

    const caption = document.createElement('div');
    caption.className = 'media-caption';
    caption.contentEditable = 'true';
    caption.spellcheck = false;
    caption.dataset.ph = 'Adicionar legenda...';
    caption.textContent = c.caption || '';
    caption.addEventListener('input', () => { c.caption = caption.textContent; debouncedSave(); });
    wrap.appendChild(caption);

    const editLink = document.createElement('div');
    editLink.className = 'media-edit-link';
    editLink.textContent = c.fileName ? 'trocar arquivo' : 'trocar url';
    editLink.addEventListener('click', async () => {
      c.url = '';
      c.fileName = '';
      c.mimeType = '';
      await saveCards(state.activePhase);
      refreshCardBody(card);
    });
    wrap.appendChild(editLink);
  }

  function buildFallback(url, label){
    const fb = document.createElement('div');
    fb.className = 'media-fallback';
    const dom = document.createElement('div');
    dom.className = 'mf-domain';
    dom.textContent = domainOf(url);
    const ti = document.createElement('div');
    ti.className = 'mf-title';
    ti.textContent = label;
    fb.appendChild(dom); fb.appendChild(ti);
    fb.addEventListener('click', () => window.open(url, '_blank'));
    return fb;
  }

  function fmtDate(iso){
    if(!iso) return '';
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }
  function daysUntil(iso){
    const target = new Date(iso + 'T00:00:00');
    const today = new Date();
    today.setHours(0,0,0,0);
    return Math.round((target - today) / 86400000);
  }

  function buildDateBody(wrap, card){
    const c = card.content;
    if(!c.date){
      const input = document.createElement('input');
      input.type = 'date';
      input.className = 'date-input';
      input.addEventListener('change', async () => {
        if(!input.value) return;
        c.date = input.value;
        await saveCards(state.activePhase);
        refreshCardBody(card);
      });
      wrap.appendChild(input);
      return;
    }
    const disp = document.createElement('div');
    disp.className = 'date-display';
    const big = document.createElement('div');
    big.className = 'date-big';
    big.textContent = fmtDate(c.date);
    big.title = 'Clique para alterar a data';
    big.style.cursor = 'pointer';
    big.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'date';
      input.className = 'date-input';
      input.value = c.date;
      input.addEventListener('change', async () => {
        c.date = input.value || c.date;
        await saveCards(state.activePhase);
        refreshCardBody(card);
      });
      input.addEventListener('blur', () => { if(input.value) { c.date = input.value; saveCards(state.activePhase); } refreshCardBody(card); });
      disp.replaceChild(input, big);
      input.focus();
    });
    disp.appendChild(big);

    const days = daysUntil(c.date);
    const count = document.createElement('div');
    count.className = 'date-count';
    if(days === 0){ count.textContent = 'É hoje'; count.classList.add('urgent'); }
    else if(days < 0){ count.textContent = `${Math.abs(days)} dia(s) atrás`; count.classList.add('done'); }
    else if(days <= 3){ count.textContent = `Faltam ${days} dia(s)`; count.classList.add('urgent'); }
    else { count.textContent = `Faltam ${days} dias`; }
    disp.appendChild(count);
    wrap.appendChild(disp);

    const label = document.createElement('div');
    label.className = 'date-label';
    label.contentEditable = 'true';
    label.spellcheck = false;
    label.dataset.ph = 'O que acontece nessa data?';
    label.textContent = c.label || '';
    label.addEventListener('input', () => { c.label = label.textContent; debouncedSave(); });
    wrap.appendChild(label);
  }

  function buildChecklistBody(wrap, card){
    const c = card.content;
    const list = document.createElement('div');
    c.items.forEach(item => list.appendChild(buildCheckItem(card, item)));
    wrap.appendChild(list);

    const add = document.createElement('div');
    add.className = 'add-check-item';
    add.textContent = '+ adicionar item';
    add.addEventListener('click', async () => {
      const item = {id:uid(), text:'', done:false};
      c.items.push(item);
      await saveCards(state.activePhase);
      refreshCardBody(card);
      requestAnimationFrame(() => {
        const el = $(`.card[data-id="${card.id}"] .ci-text[data-item="${item.id}"]`);
        if(el) el.focus();
      });
    });
    wrap.appendChild(add);
  }

  function buildCheckItem(card, item){
    const row = document.createElement('div');
    row.className = 'check-item' + (item.done ? ' done' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = item.done;
    cb.addEventListener('change', async () => {
      item.done = cb.checked;
      row.classList.toggle('done', item.done);
      await saveCards(state.activePhase);
    });
    const txt = document.createElement('div');
    txt.className = 'ci-text';
    txt.dataset.item = item.id;
    txt.contentEditable = 'true';
    txt.spellcheck = false;
    txt.textContent = item.text || '';
    txt.addEventListener('input', () => { item.text = txt.textContent; debouncedSave(); });
    txt.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); txt.blur(); } });
    const del = document.createElement('div');
    del.className = 'ci-del';
    del.textContent = '✕';
    del.addEventListener('click', async () => {
      card.content.items = card.content.items.filter(i => i.id !== item.id);
      if(card.content.items.length === 0) card.content.items.push({id:uid(), text:'', done:false});
      await saveCards(state.activePhase);
      refreshCardBody(card);
    });
    row.appendChild(cb); row.appendChild(txt); row.appendChild(del);
    return row;
  }

  function buildLinkBody(wrap, card){
    const c = card.content;
    if(!c.url){
      const row = document.createElement('div');
      row.className = 'media-url-row';
      const input = document.createElement('input');
      input.className = 'field-input';
      input.placeholder = 'Cole a URL...';
      const btn = document.createElement('button');
      btn.className = 'field-btn';
      btn.textContent = 'OK';
      const commit = async () => {
        const v = input.value.trim();
        if(!v) return;
        c.url = v;
        if(!c.label) c.label = domainOf(v);
        await saveCards(state.activePhase);
        refreshCardBody(card);
      };
      btn.addEventListener('click', commit);
      input.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); commit(); } });
      row.appendChild(input); row.appendChild(btn);
      wrap.appendChild(row);
      return;
    }
    const body = document.createElement('div');
    body.className = 'link-card-body';
    const ti = document.createElement('div');
    ti.className = 'link-title';
    ti.contentEditable = 'true';
    ti.spellcheck = false;
    ti.textContent = c.label || domainOf(c.url);
    ti.addEventListener('click', (e) => e.stopPropagation());
    ti.addEventListener('input', () => { c.label = ti.textContent; debouncedSave(); });
    const dom = document.createElement('div');
    dom.className = 'link-domain';
    dom.textContent = domainOf(c.url);
    body.appendChild(ti); body.appendChild(dom);
    body.addEventListener('click', (e) => { if(e.target !== ti) window.open(c.url, '_blank'); });
    wrap.appendChild(body);
  }

  // ---------------- SELECTION ----------------
  function selectCard(id){
    selectedCardId = id;
    $$('.card').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
    updateFocusBtnState();
  }
  function deselectCard(){
    if(!selectedCardId) return;
    selectedCardId = null;
    $$('.card.selected').forEach(el => el.classList.remove('selected'));
    updateFocusBtnState();
  }
  function updateFocusBtnState(){
    const btn = $('#focusBtn');
    btn.classList.toggle('disabled', !selectedCardId);
  }

  // ---------------- DRAG (move card + alinhamento magnético) ----------------
  const SNAP_THRESHOLD_PX = 8; // em pixels de tela, convertido para unidades do mundo conforme o zoom

  function enableDrag(cardEl, handle, card){
    let startX, startY, origX, origY, dragging = false;
    let guideV = null, guideH = null;

    handle.addEventListener('pointerdown', (e) => {
      if(e.target.closest('.card-del') || e.target.closest('.color-dot') || e.target.closest('.color-popover')) return;
      if(e.target.isContentEditable) return;
      dragging = true;
      cardEl.classList.add('dragging');
      startX = e.clientX; startY = e.clientY;
      origX = card.x; origY = card.y;
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      const dx = (e.clientX - startX) / view.zoom;
      const dy = (e.clientY - startY) / view.zoom;
      let candX = origX + dx;
      let candY = origY + dy;

      const cw = cardEl.offsetWidth, ch = cardEl.offsetHeight;
      const thr = SNAP_THRESHOLD_PX / view.zoom;
      let bestXdiff = thr, snapX = null, guideXpos = null;
      let bestYdiff = thr, snapY = null, guideYpos = null;

      const others = (cardsCache[state.activePhase] || []).filter(c => c.id !== card.id);
      others.forEach(o => {
        const oEl = canvasEl.querySelector(`.card[data-id="${o.id}"]`);
        if(!oEl) return;
        const ow = oEl.offsetWidth, oh = oEl.offsetHeight;
        const oLeft = o.x, oRight = o.x + ow, oCx = o.x + ow/2;
        const oTop = o.y, oBottom = o.y + oh, oCy = o.y + oh/2;
        const cLeft = candX, cRight = candX + cw, cCx = candX + cw/2;
        const cTop = candY, cBottom = candY + ch, cCy = candY + ch/2;

        [
          [cLeft - oLeft, oLeft, oLeft],
          [cRight - oRight, oRight - cw, oRight],
          [cCx - oCx, oCx - cw/2, oCx],
          [cLeft - oRight, oRight, oRight],
          [cRight - oLeft, oLeft - cw, oLeft]
        ].forEach(([diff, snapped, guidePos]) => {
          if(Math.abs(diff) < bestXdiff){ bestXdiff = Math.abs(diff); snapX = snapped; guideXpos = guidePos; }
        });

        [
          [cTop - oTop, oTop, oTop],
          [cBottom - oBottom, oBottom - ch, oBottom],
          [cCy - oCy, oCy - ch/2, oCy],
          [cTop - oBottom, oBottom, oBottom],
          [cBottom - oTop, oTop - ch, oTop]
        ].forEach(([diff, snapped, guidePos]) => {
          if(Math.abs(diff) < bestYdiff){ bestYdiff = Math.abs(diff); snapY = snapped; guideYpos = guidePos; }
        });
      });

      if(snapX !== null) candX = snapX;
      if(snapY !== null) candY = snapY;

      card.x = candX; card.y = candY;
      cardEl.style.left = candX + 'px';
      cardEl.style.top = candY + 'px';

      if(snapX !== null){
        if(!guideV){ guideV = document.createElement('div'); guideV.className = 'snap-guide snap-guide-v'; canvasEl.appendChild(guideV); }
        guideV.style.left = guideXpos + 'px';
        guideV.style.display = 'block';
      } else if(guideV){ guideV.style.display = 'none'; }

      if(snapY !== null){
        if(!guideH){ guideH = document.createElement('div'); guideH.className = 'snap-guide snap-guide-h'; canvasEl.appendChild(guideH); }
        guideH.style.top = guideYpos + 'px';
        guideH.style.display = 'block';
      } else if(guideH){ guideH.style.display = 'none'; }
    });
    const end = (e) => {
      if(!dragging) return;
      dragging = false;
      cardEl.classList.remove('dragging');
      try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
      if(guideV){ guideV.remove(); guideV = null; }
      if(guideH){ guideH.remove(); guideH = null; }
      debouncedSave();
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }

  // ---------------- RESIZE ----------------
  function enableResize(cardEl, handle, card){
    let startX, startY, origW, origH, resizing = false;

    handle.addEventListener('pointerdown', (e) => {
      resizing = true;
      origW = card.w || cardEl.offsetWidth;
      origH = card.h || cardEl.offsetHeight;
      startX = e.clientX; startY = e.clientY;
      handle.setPointerCapture(e.pointerId);
      e.preventDefault();
      e.stopPropagation();
    });
    handle.addEventListener('pointermove', (e) => {
      if(!resizing) return;
      const dx = (e.clientX - startX) / view.zoom;
      const dy = (e.clientY - startY) / view.zoom;
      const newW = Math.max(180, origW + dx);
      const newH = Math.max(90, origH + dy);
      card.w = newW; card.h = newH;
      cardEl.style.width = newW + 'px';
      cardEl.style.height = newH + 'px';
    });
    const end = (e) => {
      if(!resizing) return;
      resizing = false;
      try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
      debouncedSave();
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }

  // ---------------- PAN & ZOOM ----------------
  function applyTransform(){
    canvasEl.style.transform = `translate(${view.panX}px, ${view.panY}px) scale(${view.zoom})`;
    const size = 26 * view.zoom;
    canvasWrap.style.backgroundSize = size + 'px ' + size + 'px';
    canvasWrap.style.backgroundPosition = (view.panX % size) + 'px ' + (view.panY % size) + 'px';
    $('#zoomLabelBtn').textContent = Math.round(view.zoom*100) + '%';
  }

  function setZoom(newZoomRaw, cx, cy){
    const newZoom = clamp(newZoomRaw, 0.2, 3);
    const wx = (cx - view.panX) / view.zoom;
    const wy = (cy - view.panY) / view.zoom;
    view.zoom = newZoom;
    view.panX = cx - wx*newZoom;
    view.panY = cy - wy*newZoom;
    applyTransform();
  }

  function viewportCenter(){
    const rect = canvasWrap.getBoundingClientRect();
    return { x: rect.width/2, y: rect.height/2 };
  }

  function focusOnCard(cardId){
    const card = getCard(cardId);
    if(!card) return;
    const el = $(`.card[data-id="${cardId}"]`);
    if(!el) return;
    const w = el.offsetWidth, h = el.offsetHeight;
    const rect = canvasWrap.getBoundingClientRect();
    const targetZoom = clamp(Math.min((rect.width-120)/w, (rect.height-120)/h), 0.3, 2.5);
    const worldCx = card.x + w/2;
    const worldCy = card.y + h/2;
    const targetPanX = rect.width/2 - worldCx*targetZoom;
    const targetPanY = rect.height/2 - worldCy*targetZoom;

    canvasEl.style.transition = 'transform .38s cubic-bezier(.2,.8,.2,1)';
    view.zoom = targetZoom;
    view.panX = targetPanX;
    view.panY = targetPanY;
    applyTransform();
    setTimeout(() => { canvasEl.style.transition = ''; }, 400);
  }

  function setupPanZoom(){
    canvasWrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvasWrap.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const factor = Math.exp(-e.deltaY * 0.0012);
      setZoom(view.zoom * factor, mx, my);
    }, {passive:false});

    let panning = false, panStartX=0, panStartY=0, panOrigX=0, panOrigY=0;
    canvasWrap.addEventListener('pointerdown', (e) => {
      if(e.target.closest('.card')) return;
      panning = true;
      canvasWrap.classList.add('panning');
      panStartX = e.clientX; panStartY = e.clientY;
      panOrigX = view.panX; panOrigY = view.panY;
      canvasWrap.setPointerCapture(e.pointerId);
      closeAllColorPopovers();
      deselectCard();
    });
    canvasWrap.addEventListener('pointermove', (e) => {
      if(!panning) return;
      view.panX = panOrigX + (e.clientX - panStartX);
      view.panY = panOrigY + (e.clientY - panStartY);
      applyTransform();
    });
    const stopPan = (e) => {
      if(!panning) return;
      panning = false;
      canvasWrap.classList.remove('panning');
      try{ canvasWrap.releasePointerCapture(e.pointerId); }catch(err){}
    };
    canvasWrap.addEventListener('pointerup', stopPan);
    canvasWrap.addEventListener('pointercancel', stopPan);

    $('#zoomInBtn').addEventListener('click', () => {
      const c = viewportCenter();
      setZoom(view.zoom * 1.25, c.x, c.y);
    });
    $('#zoomOutBtn').addEventListener('click', () => {
      const c = viewportCenter();
      setZoom(view.zoom / 1.25, c.x, c.y);
    });
    $('#zoomLabelBtn').addEventListener('click', () => {
      const c = viewportCenter();
      setZoom(1, c.x, c.y);
    });
    $('#focusBtn').addEventListener('click', () => {
      if(!selectedCardId) return;
      focusOnCard(selectedCardId);
    });

    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape'){ deselectCard(); closeAllColorPopovers(); }
    });
    document.addEventListener('click', (e) => {
      if(!e.target.closest('.color-dot') && !e.target.closest('.color-popover')) closeAllColorPopovers();
    });
  }

  // ---------------- FAB MENU ----------------
  const fabBtn = $('#fabBtn');
  const fabMenu = $('#fabMenu');
  fabBtn.addEventListener('click', () => {
    fabBtn.classList.toggle('open');
    fabMenu.classList.toggle('open');
  });
  $$('.fab-item').forEach(item => {
    item.addEventListener('click', async () => {
      fabBtn.classList.remove('open');
      fabMenu.classList.remove('open');
      await addCard(item.dataset.type);
    });
  });
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.fab-wrap')){
      fabBtn.classList.remove('open');
      fabMenu.classList.remove('open');
    }
  });

  // ---------------- PRINT ----------------
  function printFallbackHeight(c){
    switch(c.type){
      case 'image': case 'video': return 200;
      case 'checklist': return 56 + ((c.content.items && c.content.items.length) || 1) * 22;
      case 'date': return 110;
      case 'link': return 90;
      default: return 130;
    }
  }

  async function renderPrintCard(card, width){
    const el = document.createElement('div');
    el.className = 'print-card';
    el.style.borderLeftColor = cardAccentColor(card);
    el.style.width = width + 'px';

    const head = document.createElement('div');
    head.className = 'print-card-head';
    const tag = document.createElement('span');
    tag.className = 'pc-tag';
    tag.textContent = TYPE_LABEL[card.type];
    const ti = document.createElement('span');
    ti.className = 'pc-title';
    ti.textContent = card.title || 'Sem título';
    head.appendChild(tag); head.appendChild(ti);
    el.appendChild(head);

    const body = document.createElement('div');
    body.className = 'print-card-body';
    const c = card.content;

    if(card.type === 'note'){
      body.textContent = c.text || '';
    } else if(card.type === 'image'){
      if(c.fileName){
        try{
          const objUrl = await getMediaObjectURL(c.fileName);
          const img = document.createElement('img'); img.className='pc-img'; img.src = objUrl; body.appendChild(img);
        }catch(e){ body.textContent = '(arquivo local não encontrado)'; }
      } else if(c.url){ const img = document.createElement('img'); img.className='pc-img'; img.src = c.url; body.appendChild(img); }
      else { body.textContent = '(sem imagem)'; }
      if(c.caption){ const cap = document.createElement('div'); cap.className='pc-caption'; cap.textContent = c.caption; body.appendChild(cap); }
    } else if(card.type === 'video'){
      const box = document.createElement('div'); box.className = 'pc-linkbox';
      const label = c.fileName ? ('Arquivo local: ' + c.fileName) : (c.url || '(sem link)');
      const dom = document.createElement('div'); dom.className='pc-domain'; dom.textContent = c.fileName ? (c.mimeType || 'arquivo local') : (c.url ? domainOf(c.url) : '');
      const u = document.createElement('div'); u.textContent = label;
      box.appendChild(dom); box.appendChild(u);
      body.appendChild(box);
      if(c.caption){ const cap = document.createElement('div'); cap.className='pc-caption'; cap.textContent = c.caption; body.appendChild(cap); }
    } else if(card.type === 'date'){
      const big = document.createElement('div'); big.className='pc-date-big';
      big.textContent = c.date ? fmtDate(c.date) : '(sem data)';
      body.appendChild(big);
      if(c.label){ const l = document.createElement('div'); l.className='pc-caption'; l.textContent = c.label; body.appendChild(l); }
    } else if(card.type === 'checklist'){
      (c.items || []).forEach(it => {
        const row = document.createElement('div'); row.className = 'pc-check';
        row.textContent = (it.done ? '☑ ' : '☐ ') + (it.text || '');
        body.appendChild(row);
      });
    } else if(card.type === 'link'){
      const box = document.createElement('div'); box.className = 'pc-linkbox';
      const ti2 = document.createElement('div'); ti2.style.fontWeight='700'; ti2.textContent = c.label || (c.url ? domainOf(c.url) : '(sem link)');
      const dom = document.createElement('div'); dom.className='pc-domain'; dom.textContent = c.url || '';
      box.appendChild(ti2); box.appendChild(dom);
      body.appendChild(box);
    }
    el.appendChild(body);
    return el;
  }

  async function printAll(){
    await Promise.all(state.phases.map(p => loadCards(p.id)));
    const container = $('#printArea');
    container.innerHTML = '';

    const boardTitle = document.createElement('div');
    boardTitle.className = 'print-board-title';
    boardTitle.textContent = state.title;
    container.appendChild(boardTitle);

    const sub = document.createElement('div');
    sub.className = 'print-board-sub';
    sub.textContent = `${state.phases.length} fase(s) — impresso em ${new Date().toLocaleDateString('pt-BR')}`;
    container.appendChild(sub);

    for(let idx = 0; idx < state.phases.length; idx++){
      const phase = state.phases[idx];
      const cards = cardsCache[phase.id] || [];
      const section = document.createElement('div');
      section.className = 'print-phase';

      const header = document.createElement('div');
      header.className = 'print-phase-header';
